<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" fill="none">
  <style>
    .heading { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600; fill: #111827; }
    .subheading { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-weight: 500; fill: #111827; }
    .body { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-weight: 400; fill: #6b7280; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 500; }
    .moved { font-family: 'SF Mono', monospace; font-size: 7.5px; font-weight: 500; fill: #059669; letter-spacing: 0.02em; }
  </style>
  
  <rect width="1120" height="530" fill="#fff"/>

  <!-- Row 1: 3 districts -->
  <!-- District 1: People -->
  <g transform="translate(40, 32)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">People</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Who works here and how the org is structured</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">Employee Profiles</text>
    <text x="16" y="82" class="body" font-size="8.5">View and manage employee information</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">Org Chart</text>
    <text x="16" y="124" class="body" font-size="8.5">Reporting structure and team hierarchy</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Directory</text>
    <text x="16" y="166" class="body" font-size="8.5">Search and contact employees</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Documents &amp; Forms</text>
    <text x="260" y="194" class="moved">← merged</text>
  </g>

  <!-- District 2: Pay -->
  <g transform="translate(400, 32)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">Pay</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Compensation, payroll, and getting paid</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">Pay Statements</text>
    <text x="16" y="82" class="body" font-size="8.5">Current and historical pay details</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">Compensation</text>
    <text x="260" y="110" class="moved">← consolidated</text>
    <text x="16" y="124" class="body" font-size="8.5">Salary, bonuses, and total rewards</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Tax &amp; Deductions</text>
    <text x="16" y="166" class="body" font-size="8.5">Tax forms, deductions, garnishments</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Pay Runs</text>
  </g>

  <!-- District 3: Benefits -->
  <g transform="translate(760, 32)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">Benefits</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Health plans, enrollment, and life events</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">My Benefits</text>
    <text x="260" y="68" class="moved">← consolidated</text>
    <text x="16" y="82" class="body" font-size="8.5">Current enrollment and coverage summary</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">Enrollment</text>
    <text x="16" y="124" class="body" font-size="8.5">Open enrollment and plan selection</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Life Events</text>
    <text x="16" y="166" class="body" font-size="8.5">Marriage, birth, and other qualifying events</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Dependents &amp; Claims</text>
  </g>

  <!-- Row 2: 3 districts -->
  <!-- District 4: Time -->
  <g transform="translate(40, 280)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">Time</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Scheduling, time-off, attendance, and hours</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">Time-Off</text>
    <text x="236" y="68" class="moved">← moved from WFM</text>
    <text x="16" y="82" class="body" font-size="8.5">Request, view balances, and manage approvals</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">My Schedule</text>
    <text x="16" y="124" class="body" font-size="8.5">View shifts, swap requests, and availability</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Clock In/Out</text>
    <text x="16" y="166" class="body" font-size="8.5">Time tracking and attendance</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Team Schedules</text>
  </g>

  <!-- District 5: Talent -->
  <g transform="translate(400, 280)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">Talent</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Hiring, growth, performance, and learning</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">Recruiting</text>
    <text x="16" y="82" class="body" font-size="8.5">Job postings, candidates, and hiring pipeline</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">Onboarding</text>
    <text x="16" y="124" class="body" font-size="8.5">New hire tasks, setup, and orientation</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Performance &amp; Goals</text>
    <text x="260" y="152" class="moved">← consolidated</text>
    <text x="16" y="166" class="body" font-size="8.5">Reviews, goal tracking, and feedback</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Learning &amp; Growth</text>
    <text x="260" y="194" class="moved">← consolidated</text>
  </g>

  <!-- District 6: Reports -->
  <g transform="translate(760, 280)">
    <rect width="340" height="36" rx="5" fill="#111827"/>
    <text x="16" y="16" class="mono" font-size="11" fill="#fff" letter-spacing="0.02em">Reports</text>
    <text x="16" y="30" class="mono" font-size="8" fill="#a1a1aa" letter-spacing="0.02em">Analytics, dashboards, and data exports</text>

    <rect y="44" width="340" height="160" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="0.75"/>
    
    <text x="16" y="68" class="subheading" font-size="10">Dashboards</text>
    <text x="16" y="82" class="body" font-size="8.5">At-a-glance metrics and KPIs</text>
    <line x1="16" y1="92" x2="324" y2="92" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="110" class="subheading" font-size="10">Standard Reports</text>
    <text x="16" y="124" class="body" font-size="8.5">Pre-built reports across all modules</text>
    <line x1="16" y1="134" x2="324" y2="134" stroke="#f3f4f6" stroke-width="0.75"/>
    
    <text x="16" y="152" class="subheading" font-size="10">Custom Reports</text>
    <text x="16" y="166" class="body" font-size="8.5">Build and save custom data queries</text>
    <line x1="16" y1="176" x2="324" y2="176" stroke="#f3f4f6" stroke-width="0.75"/>

    <text x="16" y="194" class="subheading" font-size="10">Exports &amp; Compliance</text>
  </g>


</svg>