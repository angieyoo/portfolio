<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1600 500">
  <rect width="1600" height="500" fill="white"/>
  <text x="80" y="56" font-family="Courier New" font-size="11" fill="#111" opacity="0.4" letter-spacing="3">EVEREST DESIGN SYSTEM — GOVERNANCE &amp; CONTRIBUTION MODEL</text>

  <!-- Step 1: Propose -->
  <rect x="80" y="90" width="220" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="100" y="120" font-family="Courier New" font-size="9" fill="#00a86b" letter-spacing="2">01  PROPOSE</text>
  <text x="100" y="150" font-family="Georgia" font-size="20" fill="#111">Pattern</text>
  <text x="100" y="175" font-family="Georgia" font-size="20" fill="#111">Request</text>
  <line x1="100" y1="195" x2="280" y2="195" stroke="#e5e7eb"/>
  <text x="100" y="215" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Any team submits</text>
  <text x="100" y="231" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">use case + evidence</text>
  <text x="100" y="247" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">across 2+ products</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="180" x2="360" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="360,174 374,180 360,186" fill="#e5e7eb"/>

  <!-- Step 2: Review -->
  <rect x="374" y="90" width="220" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="394" y="120" font-family="Courier New" font-size="9" fill="#00a86b" letter-spacing="2">02  REVIEW</text>
  <text x="394" y="150" font-family="Georgia" font-size="20" fill="#111">Systems</text>
  <text x="394" y="175" font-family="Georgia" font-size="20" fill="#111">Evaluation</text>
  <line x1="394" y1="195" x2="574" y2="195" stroke="#e5e7eb"/>
  <text x="394" y="215" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Weekly cadence</text>
  <text x="394" y="231" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">System fit · A11y</text>
  <text x="394" y="247" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Token compliance</text>

  <!-- Reject branch -->
  <line x1="484" y1="270" x2="484" y2="330" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="410" y="330" width="148" height="44" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
  <text x="484" y="350" text-anchor="middle" font-family="Courier New" font-size="10" fill="#ef4444">REJECT</text>
  <text x="484" y="366" text-anchor="middle" font-family="Courier New" font-size="10" fill="#ef4444" opacity="0.6">With rationale</text>

  <!-- Arrow 2 -->
  <line x1="594" y1="180" x2="654" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="654,174 668,180 654,186" fill="#e5e7eb"/>

  <!-- Step 3: Build (highlighted) -->
  <rect x="668" y="90" width="220" height="180" rx="8" fill="#111"/>
  <text x="688" y="120" font-family="Courier New" font-size="9" fill="#00a86b" letter-spacing="2">03  BUILD</text>
  <text x="688" y="150" font-family="Georgia" font-size="20" fill="white">Co-Build</text>
  <text x="688" y="175" font-family="Georgia" font-size="20" fill="white">+ Document</text>
  <line x1="688" y1="195" x2="868" y2="195" stroke="white" stroke-opacity="0.15"/>
  <text x="688" y="215" font-family="Courier New" font-size="10" fill="white" opacity="0.55">Systems team leads</text>
  <text x="688" y="231" font-family="Courier New" font-size="10" fill="white" opacity="0.55">Sponsor provides</text>
  <text x="688" y="247" font-family="Courier New" font-size="10" fill="white" opacity="0.55">context + intent</text>

  <!-- Arrow 3 -->
  <line x1="888" y1="180" x2="948" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="948,174 962,180 948,186" fill="#e5e7eb"/>

  <!-- Step 4: Ship -->
  <rect x="962" y="90" width="220" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="982" y="120" font-family="Courier New" font-size="9" fill="#00a86b" letter-spacing="2">04  SHIP</text>
  <text x="982" y="150" font-family="Georgia" font-size="20" fill="#111">Release +</text>
  <text x="982" y="175" font-family="Georgia" font-size="20" fill="#111">Announce</text>
  <line x1="982" y1="195" x2="1162" y2="195" stroke="#e5e7eb"/>
  <text x="982" y="215" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Versioned release</text>
  <text x="982" y="231" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Office hours demo</text>
  <text x="982" y="247" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Migration guide</text>

  <!-- Arrow 4 -->
  <line x1="1182" y1="180" x2="1242" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
  <polygon points="1242,174 1256,180 1242,186" fill="#e5e7eb"/>

  <!-- Step 5: Deprecate -->
  <rect x="1256" y="90" width="220" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="1276" y="120" font-family="Courier New" font-size="9" fill="#00a86b" letter-spacing="2">05  RETIRE</text>
  <text x="1276" y="150" font-family="Georgia" font-size="20" fill="#111">Graceful</text>
  <text x="1276" y="175" font-family="Georgia" font-size="20" fill="#111">Deprecation</text>
  <line x1="1276" y1="195" x2="1456" y2="195" stroke="#e5e7eb"/>
  <text x="1276" y="215" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Lint warnings</text>
  <text x="1276" y="231" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Sunset timeline</text>
  <text x="1276" y="247" font-family="Courier New" font-size="10" fill="#111" opacity="0.45">Replacement path</text>

  <!-- Bottom principle -->
  <line x1="80" y1="420" x2="1520" y2="420" stroke="#e5e7eb"/>
  <text x="80" y="450" font-family="Courier New" font-size="10" fill="#111" opacity="0.3" letter-spacing="1">PRINCIPLE: Any team can propose. The systems team decides. Everyone benefits.</text>
</svg>
